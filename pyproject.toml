[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rovingbandit"
version = "0.1.0"
description = "A flexible library for multi-armed bandit algorithms supporting regret minimization, best-arm identification, and variance minimization"
readme = "SPEC.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Apoorva Lal"}
]
keywords = [
    "bandits",
    "multi-armed-bandits",
    "reinforcement-learning",
    "experimental-design",
    "thompson-sampling",
    "ucb",
    "adaptive-experiments"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.20",
    "ty>=0.0.49",
    "prek>=0.2.6",
    "ipykernel>=6.31.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
all = [
    "rovingbandit[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/apoorvalal/rovingbandit"
Documentation = "https://github.com/apoorvalal/rovingbandit"
Repository = "https://github.com/apoorvalal/rovingbandit"

[tool.hatch.build.targets.wheel]
packages = ["src/rovingbandit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=rovingbandit",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "ANN401",  # allow explicit use of Any
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/**" = ["ANN"]  # tests need not be fully annotated
"examples/**" = ["ANN"]  # example scripts need not be fully annotated
"src/rovingbandit/banditry.py" = ["ANN"]  # legacy backward-compat module

[tool.ty.src]
include = ["src"]  # type-check the library, not tests/examples
exclude = ["src/rovingbandit/banditry.py"]  # legacy backward-compat module
