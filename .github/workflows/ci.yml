name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Setup environment
        run: make setup
      - name: Run prek hooks
        uses: j178/prek-action@v1
        env:
          SKIP: no-commit-to-branch

  test:
    needs: prek
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup environment
        run: make setup
      - name: Run tests
        run: make tests
